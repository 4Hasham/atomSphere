<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .ink { fill: #17181a; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f1f1ee; } }
  </style>
  <defs>
    <mask id="cut">
      <rect width="100" height="100" fill="#fff" />
      <ellipse cx="50" cy="50" rx="46" ry="13.5" fill="none" stroke="#000" stroke-width="9" transform="rotate(-24 50 50)" />
      <circle cx="59.2" cy="32" r="9" fill="#000" />
    </mask>
  </defs>
  <circle class="ink" cx="50" cy="50" r="46" mask="url(#cut)" />
